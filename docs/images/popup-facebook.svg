<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">Painel do Foco Total para Facebook</title>
  <desc id="desc">Prévia do painel escuro da extensão com controles para ocultar o feed do Facebook.</desc>
  <rect width="1000" height="700" rx="24" fill="#080b08"/>
  <rect x="24" y="24" width="952" height="652" rx="18" fill="#101510" stroke="#2c4027" stroke-width="2"/>
  <circle cx="72" cy="78" r="28" fill="#a4f21a"/>
  <circle cx="72" cy="78" r="13" fill="#101510"/>
  <text x="120" y="74" fill="#f3f7ef" font-family="Arial, sans-serif" font-size="30" font-weight="700">Foco Total</text>
  <text x="120" y="102" fill="#a5b29e" font-family="Arial, sans-serif" font-size="17">Oculte distrações das redes sociais</text>
  <rect x="820" y="50" width="48" height="48" rx="10" fill="#101510" stroke="#30442a"/>
  <text x="833" y="83" fill="#b9f735" font-family="Arial, sans-serif" font-size="25">↻</text>
  <rect x="876" y="50" width="48" height="48" rx="10" fill="#101510" stroke="#30442a"/>
  <text x="889" y="83" fill="#b9f735" font-family="Arial, sans-serif" font-size="24">⚙</text>
  <text x="56" y="154" fill="#b9f735" font-family="Arial, sans-serif" font-size="16" font-weight="700">FACEBOOK · v1.0.7</text>
  <rect x="48" y="178" width="904" height="70" rx="12" fill="#0b0f0b" stroke="#30442a"/>
  <text x="72" y="221" fill="#f3f7ef" font-family="Arial, sans-serif" font-size="20">Ativado no Facebook</text>
  <circle cx="886" cy="213" r="18" fill="#a4f21a"/>
  <circle cx="892" cy="213" r="12" fill="#f7fff1"/>
  <rect x="48" y="260" width="904" height="48" rx="10" fill="#101510" stroke="#30442a"/>
  <text x="72" y="291" fill="#b9f735" font-family="Arial, sans-serif" font-size="18">↻ Restaurar configurações do Facebook</text>
  <text x="58" y="346" fill="#a4f21a" font-family="Arial, sans-serif" font-size="15" font-weight="700">FEED E PUBLICAÇÃO</text>
  <g font-family="Arial, sans-serif" font-size="19" fill="#f3f7ef">
    <rect x="48" y="366" width="904" height="58" rx="10" fill="#171e15"/>
    <text x="72" y="402">Ocultar barra de postagem</text>
    <rect x="48" y="434" width="904" height="58" rx="10" fill="#171e15"/>
    <text x="72" y="470">Ocultar feed Para você / Foryou</text>
    <rect x="48" y="502" width="904" height="58" rx="10" fill="#171e15"/>
    <text x="72" y="538">Ocultar stories</text>
    <rect x="48" y="570" width="904" height="58" rx="10" fill="#171e15"/>
    <text x="72" y="606">Ocultar sugestões de grupos</text>
  </g>
  <g fill="#a4f21a">
    <rect x="870" y="380" width="54" height="30" rx="15"/><circle cx="909" cy="395" r="11" fill="#f7fff1"/>
    <rect x="870" y="448" width="54" height="30" rx="15"/><circle cx="909" cy="463" r="11" fill="#f7fff1"/>
    <rect x="870" y="516" width="54" height="30" rx="15"/><circle cx="909" cy="531" r="11" fill="#f7fff1"/>
    <rect x="870" y="584" width="54" height="30" rx="15"/><circle cx="909" cy="599" r="11" fill="#f7fff1"/>
  </g>
  <text x="58" y="654" fill="#a4f21a" font-family="Arial, sans-serif" font-size="15" font-weight="700">CONTROLES ADICIONAIS</text>
</svg>
