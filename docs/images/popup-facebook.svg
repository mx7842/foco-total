  </g>
  <g fill="#a4f21a">
    <rect x="870" y="322" width="54" height="30" rx="15"/><circle cx="909" cy="337" r="11" fill="#f7fff1"/>
    <rect x="870" y="390" width="54" height="30" rx="15"/><circle cx="909" cy="405" r="11" fill="#f7fff1"/>
    <rect x="870" y="458" width="54" height="30" rx="15"/><circle cx="909" cy="473" r="11" fill="#f7fff1"/>
    <rect x="870" y="526" width="54" height="30" rx="15"/><circle cx="909" cy="541" r="11" fill="#f7fff1"/>
  </g>
  <text x="58" y="624" fill="#a4f21a" font-family="Arial, sans-serif" font-size="15" font-weight="700">CONTROLES ADICIONAIS</text>
  <text x="58" y="654" fill="#b8c3b2" font-family="Arial, sans-serif" font-size="17">Busca · menu lateral · patrocinados · botão flutuante</text>
